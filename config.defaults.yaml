# Kaotim plugin defaults. A repo overrides any key in .kaotim/config.yaml.
# Runtime: Python 3.9+ via scripts/kaotim.py. Windows: ensure `python` or `py -3` on PATH.

caps:
  green_attempts: 5
  supervisor_rejects: 3
  structure_refactors: 2
  bug_fix_rounds: 2

approvals:
  require_tests: true           # human gate after tdd_red before feature-dev

parallel:
  max_agents: 4

# Model tiers. Each value becomes the `model:` frontmatter of the agents in that tier.
tiers:
  strong: inherit               # supervisor, bug-reviewer
  standard: inherit             # test-writer, feature-dev, structure-reviewer, refactorer, fixer
  fast: fast                    # explorer, cleaner, pr-writer

prices: {}

review:
  bug_severity_block: medium

budgets:
  orchestrator_per_stage: 15000
  subagent_default: 40000

fast_lane:
  max_files: 3

git:
  base_branch: main
  commit_convention: conventional
  pr_cli: gh

# Shell commands the CLI runs for gates / worktrees. Fill in the target repo's .kaotim/config.yaml.
# `test` must be non-empty after plan approve, before tdd_red.
commands:
  test: ""
  test_file: ""                 # optional; supports {file} / {files}
  lint: ""
  typecheck: ""
  build: ""
  worktree_setup: ""
  junit_flag: ""                # optional; e.g. --junitxml={path} or --log-junit={path}

# Extra substrings that mark a failure as wrong-reason (not valid red). Merged with built-in defaults.
verify:
  wrong_reason_signatures: []
